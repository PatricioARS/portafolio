server {
    listen 80;
    server_name _;

    # 1. Servir el frontend compilado (Vue)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Redirigir peticiones de la API a Django
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 3. Servir fotos y archivos de la base de datos
    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # 4. Redirigir el panel de administración
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}