services:
  db:
    image: mysql:8.0
    container_name: portafolio-db
    restart: always
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: .
    container_name: portafolio-backend
    restart: always
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: portafolio-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data: