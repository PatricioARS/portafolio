services:
  db:
    image: mysql:8.0
    container_name: portafolio-db-local
    restart: always
    environment:
      MYSQL_DATABASE: portfolio_db
      MYSQL_ROOT_PASSWORD: 123456
    ports:
      - "3307:3306"
    volumes:
      - db_data_local:/var/lib/mysql

  backend:
    build: .
    container_name: portafolio-backend-local
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env

  frontend:
    build: ./frontend
    container_name: portafolio-frontend-local
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      - static_volume:/app/staticfiles
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf

volumes:
  db_data_local: